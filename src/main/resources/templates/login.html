<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — POS Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --blue: #2563eb; --blue-dark: #1d4ed8; --blue-light: #eff6ff;
            --red: #dc2626; --red-light: #fef2f2;
            --green: #16a34a; --green-light: #f0fdf4;
            --gray-100: #f1f5f9; --gray-200: #e2e8f0; --gray-400: #94a3b8;
            --gray-500: #64748b; --gray-700: #334155; --gray-800: #1e293b; --gray-900: #0f172a;
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
        }
        body {
            font-family: 'Inter','Segoe UI',system-ui,sans-serif;
            background: var(--gray-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            width: 380px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo-icon {
            width: 52px; height: 52px;
            background: var(--blue);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            font-size: 24px; color: #fff;
        }
        .login-logo h1 { font-size: 18px; font-weight: 700; color: var(--gray-800); }
        .login-logo p { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--gray-700); margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--gray-400); }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 9px 12px 9px 36px;
            border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
            font-size: 13px; color: var(--gray-800); background: #fff;
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-login {
            width: 100%; padding: 10px;
            background: var(--blue); color: #fff;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.15s;
            margin-top: 4px;
        }
        .btn-login:hover { background: var(--blue-dark); }
        .alerta-error {
            background: var(--red-light); color: var(--red);
            border: 1px solid #fecaca; border-radius: var(--radius-sm);
            padding: 10px 14px; font-size: 13px; font-weight: 500;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .alerta-ok {
            background: var(--green-light); color: var(--green);
            border: 1px solid #bbf7d0; border-radius: var(--radius-sm);
            padding: 10px 14px; font-size: 13px; font-weight: 500;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .login-footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--gray-400); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="login-logo-icon"><i class="ti ti-shopping-cart"></i></div>
            <h1>POS Ventas</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <div th:if="${param.error}" class="alerta-error">
            <i class="ti ti-alert-circle"></i> Usuario o contraseña incorrectos
        </div>
        <div th:if="${param.logout}" class="alerta-ok">
            <i class="ti ti-check"></i> Sesión cerrada correctamente
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <div class="input-wrap">
                    <i class="ti ti-user"></i>
                    <input type="text" name="username" placeholder="Ingresa tu usuario" autofocus>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <div class="input-wrap">
                    <i class="ti ti-lock"></i>
                    <input type="password" name="password" placeholder="Ingresa tu contraseña">
                </div>
            </div>
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="login-footer">Sistema POS v1.0</div>
    </div>
</body>
</html>
