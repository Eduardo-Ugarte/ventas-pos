spring.application.name=ventas

# Credenciales via variables de entorno (con valores por defecto para desarrollo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos?useSSL=false&serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
